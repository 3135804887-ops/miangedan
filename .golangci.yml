# golangci-lint 配置（CI 阶段 2 使用；Go SAST 基线由 gosec 提供）
# 追踪：docs/architecture/EPIC-01-INFRA-DESIGN.md 第 4.3 节
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
  issues:
    max-issues-per-linter: 0
    max-same-issues: 0
formatters:
  enable:
    - gofmt
