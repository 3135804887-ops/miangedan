# 面个蛋前端工作区（frontend-global-pages 批次 0）
# contracts/ts 是由 docs/api/openapi.yaml 生成的只读类型包，按 contracts/README.md 规则 1 存放于 contracts/ 下，
# 同时纳入工作区以便 apps/* 通过 workspace:* 消费。
packages:
  - apps/*
  - packages/*
  - contracts/ts
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  msw: false
  sharp: true
