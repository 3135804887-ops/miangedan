# 面个蛋 PR 门禁流水线（TASK-001）
# 阶段划分追踪：docs/architecture/EPIC-01-INFRA-DESIGN.md 第 4.3 节
# 门禁纪律：不得以降低覆盖率、删除用例或跳阶段方式让流水线变绿（AGENTS.md 第 2 节）
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action 扫描 PR 提交列表需要 pull-requests 读取权（否则报 Resource not accessible by integration）
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1-spec-validation:
    name: "阶段1 规范校验"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装校验依赖
        run: pip install -r tools/requirements-dev.txt
      - name: 文档治理与需求追踪校验（0 失败门槛）
        run: python tools/validate_docs.py --suites required,fences,placeholders,coverage,consistency,semantics,regions,data-platform,temporal,observability,key-mgmt,channels,backup

  stage2-lint:
    name: "阶段2 静态检查"
    needs: stage1-spec-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt 检查（输出必须为空）
        run: test -z "$(gofmt -l services/)"
      - name: go vet（逐模块；go.work 根目录不支持 ./... 通配）
        run: |
          for m in services/*/ workflows/; do
            (cd "$m" && go vet ./...) || exit 1
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 Python 工具链
        run: pip install -r tools/requirements-dev.txt
      - name: ruff lint + format（全部 AI 服务）
        run: |
          for d in ai/services/*/; do
            (cd "$d" && ruff check . && ruff format --check .) || exit 1
          done
      - name: mypy strict（全部 AI 服务）
        run: |
          for d in ai/services/*/; do
            (cd "$d" && mypy src tests) || exit 1
          done
      # TypeScript eslint/tsc 随 EPIC-02 首个前端任务接入（apps/ 落地 package.json 后）

  stage2-golangci:
    name: "阶段2 golangci-lint（含 gosec SAST 基线）"
    needs: stage1-spec-validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [adminapi, backup, billing, consent, identity, ingestion, migrate, notify, observability, org, project, provider, region, room, secretref, source, temporal]
    steps:
      - uses: actions/checkout@v4
      - name: golangci-lint（逐模块；根配置经 --config 显式指定）
        # action v6 的 latest 仅解析 v1.x（go1.24 构建，低于仓内 go 1.26 目标版本必失败）；
        # v2 需 action v7+，此处固定 action 主版本与 lint 版本（与本地验证一致）
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: services/${{ matrix.module }}
          args: --config ../../.golangci.yml

  stage2-golangci-workflows:
    name: "阶段2 golangci-lint（workflows 模块）"
    needs: stage1-spec-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: golangci-lint（workflows 模块；配置位于仓库根）
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: workflows
          args: --config ../.golangci.yml

  stage3-unit-tests:
    name: "阶段3 单元测试"
    needs: [stage2-lint, stage2-golangci, stage2-golangci-workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go test（逐模块）
        run: |
          for m in services/*/ workflows/; do
            (cd "$m" && go test ./...) || exit 1
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 Python 工具链
        run: pip install -r tools/requirements-dev.txt
      - name: pytest（全部 AI 服务）
        run: |
          for d in ai/services/*/; do
            (cd "$d" && pytest) || exit 1
          done
      # 评分边界案例 SC-EC-01~24 回归由 TASK-040 / TASK-045 接入本阶段

  stage4-contract-tests:
    name: "阶段4 契约校验"
    needs: stage3-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装校验依赖
        run: pip install -r tools/requirements-dev.txt
      - name: YAML/JSON/OpenAPI/JSON Schema 契约校验（0 失败门槛）
        run: python tools/validate_docs.py --suites yaml,json,schema,openapi
      # 契约生成物 diff 校验挂接 TASK-016；Schema 样例校验挂接 TASK-031；
      # 事件目录一致性检查挂接 EPIC-03 首个实时任务 TASK-020

  stage5-security:
    name: "阶段5 安全扫描"
    needs: stage4-contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装校验依赖
        run: pip install -r tools/requirements-dev.txt
      - name: 仓内密钥模式扫描
        run: python tools/validate_docs.py --suites secrets
      - name: gitleaks 全历史扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 依赖漏洞门禁说明：GitHub 原生 dependency-review-action 在私有仓库需 GitHub Advanced Security
      # 许可（公开仓库免费），当前私有免费库不可用。以 govulncheck（Go 官方漏洞库）+ pip-audit
      # （PyPI 官方漏洞库）实现同等依赖漏洞门禁；仓库转公开或购买 GHAS 后可换回原生 action。
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: govulncheck（Go 依赖漏洞，逐模块）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for m in services/*/ workflows/; do
            (cd "$m" && govulncheck ./...) || exit 1
          done
      - name: pip-audit（Python 工具链依赖漏洞）
        run: |
          pip install pip-audit
          pip-audit -r tools/requirements-dev.txt
      - name: 生成 SBOM 并上传工件
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-${{ github.sha }}
      # SAST 基线 = 阶段2 golangci-lint(gosec) + ruff S 规则集；
      # 平台级 SAST（如 CodeQL）如需引入，按变更流程评估后扩展本阶段

  stage6-build:
    name: "阶段6 构建"
    needs: stage5-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go build（逐模块；产物写入临时目录，不污染工作区）
        run: |
          tmpbin="$(mktemp -d)"
          for m in services/*/ workflows/; do
            if (cd "$m" && go list -f '{{.Name}}' ./... 2>/dev/null | grep -q '^main$'); then
              (cd "$m" && go build -o "$tmpbin/" ./...) || exit 1
            else
              (cd "$m" && go build ./...) || exit 1
            fi
          done
          rm -rf "$tmpbin"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python 包可安装性检查（全部 AI 服务）
        run: |
          for d in ai/services/*/; do
            pip install "$d" || exit 1
          done
      # 前端构建（apps/web、apps/admin）随 EPIC-02 / EPIC-09 首个前端任务接入本阶段

  # 主分支追加（EPIC-01-INFRA-DESIGN 第 4.3 节）：
  # 集成测试挂接 TASK-004；评测集回归挂接 TASK-036；dev 环境部署挂接 TASK-002。
