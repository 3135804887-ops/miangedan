name: Setup frontend
description: 安装 Node、pnpm 与前端工作区依赖
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: pnpm
    - name: 安装前端依赖（锁文件冻结）
      shell: bash
      run: pnpm install --frozen-lockfile
