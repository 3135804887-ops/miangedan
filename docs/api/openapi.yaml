      type: object
      additionalProperties: false
      required: [assessment_id, data_region, mode, consent_required, modal_title, modal_message, effects, allowed_scoring_dimensions]
      properties:
        assessment_id: { type: string, format: uuid }
        data_region: { $ref: '#/components/schemas/Region' }
        mode: { $ref: '#/components/schemas/MaterialMode' }
