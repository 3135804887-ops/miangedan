        job_family: { type: string }
        company: { type: ['string', 'null'] }
        role: { type: ['string', 'null'] }
        level: { type: ['string', 'null'] }
        is_unofficial_experience: { type: boolean, description: 候选人经验必须标记非官方（FR-008） }
        summary: { type: ['string', 'null'], description: 结构化提取摘要；网页内容仅作不可信数据（SEC-024/SEC-025） }
        status: { $ref: '#/components/schemas/SourceStatus' }
        data_region: { $ref: '#/components/schemas/Region' }
        created_at: { type: string, format: date-time }
    SourceSearchQuery:
      type: object
