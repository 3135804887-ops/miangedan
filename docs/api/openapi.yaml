      required: [consent_grant_id, assessment_id, data_region, mode, accepted, effects]
      properties:
        consent_grant_id: { type: string, format: uuid }
        assessment_id: { type: string, format: uuid }
        data_region: { $ref: '#/components/schemas/Region' }
        mode: { enum: [jd_only, resume_only, neither] }
