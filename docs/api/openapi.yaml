# =============================================================================
# 面个蛋（MianGeDan）业务 API 契约
# 追踪：PRD-001 "API and Integration Principles"；US-01 ~ US-08；FR-001 ~ FR-040
# 一致性锚点：docs/domain/DOMAIN-MODEL.md、INTERVIEW-STATE-MACHINE.md、
#             BILLING-STATE-MACHINE.md、docs/ai/SCORING-SPEC.md、ai/schemas/
#
# 【平台级硬约束】
# 1. 本系统不存在任何修改个人分数或解锁状态的端点；个体结果只能由正式复核
#    服务（POST /v1/projects/{projectId}/rounds/{sequence}/review）产生新版本。
# 2. 浏览器不直接持有模型、支付或数字人供应商密钥；实时媒体使用短期房间令牌，
#    业务 API 令牌与媒体令牌相互隔离。
# 3. 所有写操作要求 Idempotency-Key；删除、导出、评分、退款为异步任务，
#    必须返回真实进度查询端点。
# 4. 第三方回调采用签名验证、重放防护和幂等处理。
# 5. 外部网页内容仅作为不可信数据进入结构化提取，不得作为系统指令。
# =============================================================================
openapi: 3.1.0
info:
  title: 面个蛋 MianGeDan API
  version: "1.0.0"
  description: |
    面个蛋（MianGeDan）业务 API v1。追踪 PRD-001 V1.0（docs/prd/PRD-001-面个蛋-V1.0.md）。

    ## 统一约定
    - **幂等**：所有 POST/PATCH/DELETE 写操作必须携带 `Idempotency-Key` 请求头；
      相同键重复提交返回首个结果，不产生重复副作用（NFR-006）。
    - **分页**：列表端点使用 `cursor` + `limit`（默认 20，最大 100），响应含 `next_cursor`。
    - **区域**：`data_region ∈ {cn, eu, intl}` 随 JWT claim 与响应返回；跨区域访问返回 `region_mismatch`。
    - **错误**：统一 Error 结构（见 components.schemas.Error）。
    - **异步任务**：删除、导出、评分、退款返回任务 ID，通过对应 GET 端点查询真实进度。
    - **版本**：路径版本 `/v1`；响应不携带供应商密钥、内部模型端点等机密信息。
servers:
  - url: https://{region}.api.miangedan.example
    description: 区域化 API 入口（三数据区相互隔离）
    variables:
      region:
        enum: [cn, eu, intl]
        default: intl
        description: 数据区域；用户请求必须路由到其账户所属区域

tags:
  - name: identity
    description: 登录、会话、账户与多身份绑定（US-05、FR-027；TASK-010）
  - name: account
    description: 账户与多身份绑定（US-05、FR-027、FR-029）
  - name: consents
    description: 授权中心：六类独立授权与机构分享授权（FR-040、隐私规则）
  - name: uploads
    description: 简历隔离上传、恶意文件扫描与可重试状态（TASK-012、FR-001、FR-006）
  - name: parsing
    description: 简历/JD 供应商中立结构化解析、逐字段校对与隐私硬门槛（TASK-013、TASK-014）
  - name: resumes
    description: 简历上传、解析、校对与版本（US-01、FR-001 ~ FR-003、FR-006）
  - name: jobs
    description: 岗位 JD 解析与版本（US-01、FR-004、FR-005）
  - name: sources
    description: 企业公开流程来源：检索、来源元数据与通用模板回退（US-02、FR-007、FR-008）
  - name: projects
    description: 面试项目生命周期（US-05、FR-029、FR-030）
  - name: plans
    description: 面试计划生成、编辑与冻结（US-02、FR-009 ~ FR-012）
  - name: sessions
    description: 实时面试房间与会话控制（US-03、FR-013 ~ FR-020）
  - name: scores
    description: 评分结果与正式复核（US-04、FR-021、FR-025）
  - name: reports
    description: 报告生成、局部重试与导出（US-04、FR-023、FR-026）
  - name: practice
    description: 非评分练习（永不改变正式分数；FR-024）
  - name: retries
    description: 正式重试与维度锁定（FR-024）
  - name: billing
    description: 报价、订单、额度账本、退款与订阅（US-06、FR-031 ~ FR-033）
  - name: organizations
    description: 机构租户、任务、细粒度授权与聚合（US-07、FR-034 ~ FR-036）
  - name: deletion
    description: 数据删除任务与真实进度（FR-040、US-05 场景 5）
  - name: admin
    description: |
      运营治理（US-08、FR-037 ~ FR-040）。默认脱敏；职责分离；全部敏感操作写审计。
      **本系统不存在任何修改个人分数或解锁状态的端点；个体结果只能由正式复核服务产生新版本。**

paths:
  # ============================== identity (TASK-010) ==============================
  /v1/identity/email/challenges:
    post:
      tags: [identity]
      operationId: createEmailIdentityChallenge
      summary: 创建邮箱验证码挑战（有效期、频率限制与风险验证；不泄露账户是否存在）
      description: |
        邮件必须经 `services/notify` 的所属数据区通道投递。服务端仅持久化邮箱主体摘要与
        验证码散列；通知模板变量不得携带简历/回答正文、业务令牌或媒体。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, data_region]
              properties:
                email: { type: string, format: email, example: "synthetic.user@example.com" }
                data_region: { $ref: '#/components/schemas/Region' }
      responses:
        '202': { description: 挑战已创建或返回同一幂等结果, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationChallenge' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Error' }
  /v1/identity/email/challenges/{challengeId}/verify:
    post:
      tags: [identity]
      operationId: verifyEmailIdentityChallenge
      summary: 校验邮箱验证码并签发短期、单次使用的身份验证证明
      security: []
      parameters:
        - $ref: '#/components/parameters/IdentityChallengeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, data_region]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
                data_region: { $ref: '#/components/schemas/Region' }
      responses:
        '200': { description: 验证成功；证明可用于登录或绑定且只能消费一次, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationProof' } } } }
        '401': { description: 验证码无效、过期、已消费或超过尝试次数, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/identity/oauth/{provider}/verify:
    post:
      tags: [identity]
      operationId: verifyOAuthIdentity
      summary: 验证 Google / Apple / 微信身份并签发短期、单次使用证明
      description: |
        调用供应商中立的身份适配器；Google/Apple 仅 eu/intl，微信仅 cn。供应商故障返回
        `provider_unavailable` 且明确 `email_fallback_available=true`，不接收或暴露供应商密钥。
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { enum: [google, apple, wechat] }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorization_code, data_region]
              properties:
                authorization_code: { type: string, minLength: 1, description: 一次性授权码（仅服务端适配器消费） }
                redirect_uri: { type: ['string', 'null'], format: uri }
                data_region: { $ref: '#/components/schemas/Region' }
      responses:
        '200': { description: 验证成功, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationProof' } } } }
        '503': { description: 第三方不可用；可改用邮箱验证码, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/identity/sessions:
    post:
      tags: [identity]
      operationId: createIdentitySession
      summary: 使用已验证证明登录；首次身份同时创建所属数据区账户
      description: 未满 16 岁不得创建账户；首次注册必须提交服务条款、隐私政策与数据处理说明版本证据。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof_token, data_region]
              properties:
                proof_token: { type: string, minLength: 32, description: 短期单次身份验证证明；禁止写日志 }
                data_region: { $ref: '#/components/schemas/Region' }
                registration: { oneOf: [{ $ref: '#/components/schemas/IdentityRegistration' }, { type: 'null' }] }
      responses:
        '201': { description: 会话已创建；重复幂等请求返回同一结果, content: { application/json: { schema: { $ref: '#/components/schemas/IdentitySession' } } } }
        '409': { description: 已验证身份与请求区域冲突或注册资料缺失, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/identity/sessions/refresh:
    post:
      tags: [identity]
      operationId: refreshIdentitySession
      summary: 轮换刷新令牌并签发新业务令牌（旧刷新令牌立即失效）
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, data_region]
              properties:
                refresh_token: { type: string, minLength: 32, description: 禁止写日志 }
                data_region: { $ref: '#/components/schemas/Region' }
      responses:
        '200': { description: 令牌已轮换, content: { application/json: { schema: { $ref: '#/components/schemas/IdentitySession' } } } }
        '401': { description: 刷新令牌无效、已轮换或已过期, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/identity/account:
    get:
      tags: [identity]
      operationId: getIdentityAccount
      summary: 获取当前账户与已绑定身份（不返回 provider_subject）
      responses:
        '200': { description: 账户信息, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [identity]
      operationId: updateIdentityAccount
      summary: 更新界面语言等账户偏好（界面语言与面试语言相互独立）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                ui_language: { $ref: '#/components/schemas/Language' }
                display_name: { type: ['string', 'null'], maxLength: 120, description: 可选称呼 }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/identity/bindings:
    post:
      tags: [identity]
      operationId: bindVerifiedIdentity
      summary: 使用当前侧与目标侧两个独立验证证明绑定身份；任何冲突均不合并账户
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_proof_token, target_proof_token]
              properties:
                source_proof_token: { type: string, minLength: 32, description: 当前账户已绑定身份的重新验证证明 }
                target_proof_token: { type: string, minLength: 32, description: 待绑定身份的独立验证证明 }
      responses:
        '201': { description: 绑定成功；两份证明均被单次消费, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityBinding' } } } }
        '409': { description: 双侧验证不完整或目标身份属于另一账户；未合并，返回恢复案件与人工支持路径, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== account data rights ==============================
  /v1/me/deletion:
    post:
      tags: [account]
      operationId: requestAccountDeletion
      summary: 创建账户删除任务（重新验证后；级联删除或不可逆匿名化；法定财务记录保留但解除内容关联）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauth_proof, confirmation_text]
              properties:
                reauth_proof: { type: string, description: 重新认证凭证 }
                confirmation_text: { type: string, description: 用户输入的确认文案 }
      responses:
        '202': { description: 删除任务已创建，返回任务 ID 查询真实进度, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionTask' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/me/export:
    get:
      tags: [account]
      operationId: requestDataExport
      summary: 创建数据导出任务（异步，返回任务进度）
      responses:
        '202': { description: 导出任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncTask' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== consent ==============================
  /v1/consent/grants:
    get:
      tags: [consents]
      operationId: listConsentGrants
      summary: 列出六类相互独立的当前授权状态（未授权类别显式返回 not_granted）
      responses:
        '200':
          description: 当前授权中心状态；模型训练无有效记录时为 not_granted
          content:
            application/json:
              schema:
                type: object
                required: [data_region, items]
                properties:
                  data_region: { $ref: '#/components/schemas/Region' }
                  items:
                    type: array
                    minItems: 6
                    items: { $ref: '#/components/schemas/ConsentState' }
        default: { $ref: '#/components/responses/Error' }
  /v1/consent/grants/{consentType}:
    put:
      tags: [consents]
      operationId: grantConsent
      summary: 明确授予一类授权（新版本追加；六类互不联动）
      parameters:
        - name: consentType
          in: path
          required: true
          schema: { enum: [core_service, raw_av_recording, org_sharing, product_analytics, model_training, marketing] }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentGrantRequest' }
      responses:
        '201': { description: 授权版本与追加式审计已在同一事务写入, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentGrant' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/consent/grants/{consentType}/withdrawals:
    post:
      tags: [consents]
      operationId: withdrawConsent
      summary: 撤回精确范围的授权（返回前即使在线访问失效，并在同一事务写追加式审计）
      parameters:
        - name: consentType
          in: path
          required: true
          schema: { enum: [core_service, raw_av_recording, org_sharing, product_analytics, model_training, marketing] }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentWithdrawalRequest' }
      responses:
        '201': { description: 已追加 withdrawn 版本和审计；原历史版本未修改, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentGrant' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/consent/grants/{consentType}/history:
    get:
      tags: [consents]
      operationId: listConsentHistory
      summary: 查询某类授权的全部追加式证据版本
      parameters:
        - name: consentType
          in: path
          required: true
          schema: { enum: [core_service, raw_av_recording, org_sharing, product_analytics, model_training, marketing] }
      responses:
        '200':
          description: 按 scope_hash、version 排序的授权证据历史
          content:
            application/json:
              schema:
                type: object
                required: [data_region, items]
                properties:
                  data_region: { $ref: '#/components/schemas/Region' }
                  items: { type: array, items: { $ref: '#/components/schemas/ConsentGrant' } }
        default: { $ref: '#/components/responses/Error' }
  /v1/consent/access-decisions:
    post:
      tags: [consents]
      operationId: decideConsentAccess
      summary: 按当前最新版本同步判定在线访问；状态不确定一律拒绝
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentAccessRequest' }
      responses:
        '200': { description: 同步访问判定；撤回完成后同范围必为 allowed=false, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentAccessDecision' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== uploads ==============================
  /v1/uploads/resumes:
    post:
      tags: [uploads]
      operationId: createResumeUpload
      summary: 上传简历到所属数据区 uploads 隔离桶并启动一次性沙箱安全扫描
      description: |
        追踪 TASK-012、FR-001、FR-006、TM-02、SEC-020。仅接受 PDF、DOC、DOCX，
        单文件最大 10 MiB。服务不信任扩展名或 Content-Type；对象先写入所属区域
        `{region}-uploads/quarantine/` 前缀，绝不写入 exports/media 桶，再由无出站网络、
        只读根文件系统、无凭证挂载的一次性沙箱检测病毒、宏、压缩炸弹、伪装、
        损坏与加密。安全拒绝会删除隔离对象；扫描器暂时不可用或超时时保留隔离原件，
        可通过 retry 端点只重试扫描步骤。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 合法扩展名为 .pdf/.doc/.docx，实际大小不超过 10 MiB
      responses:
        '202':
          description: 已进入隔离扫描；相同 Idempotency-Key 返回同一 upload_id，不重复写对象或扫描
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeUpload' }
        '413':
          description: 实际文件超过 10 MiB，未写入任何对象存储桶
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRejectedError' }
        '415':
          description: 扩展名或实际类型不受支持，或二者不一致（伪装）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRejectedError' }
        '422':
          description: 文件损坏、加密，或检测到病毒、宏、压缩炸弹等不安全内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadRejectedError' }
        default: { $ref: '#/components/responses/Error' }
  /v1/uploads/{uploadId}:
    get:
      tags: [uploads]
      operationId: getResumeUpload
      summary: 查询隔离上传与扫描真实状态
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: 上传状态；拒绝时包含具体可理解原因，暂时失败时说明原件保留与重试动作
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeUpload' }
        default: { $ref: '#/components/responses/Error' }
  /v1/uploads/{uploadId}:retry:
    post:
      tags: [uploads]
      operationId: retryResumeUploadScan
      summary: 只重试暂时失败的安全扫描步骤（复用隔离原件）
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 重试已受理；相同 Idempotency-Key 返回首个结果，不重复扫描
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeUpload' }
        '409':
          description: 已接受、已安全拒绝或正在扫描的上传不可重试
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ============================== parsing ==============================
  /v1/parsing/resumes:
    post:
      tags: [parsing]
      operationId: createResumeParseTask
      summary: 从安全扫描通过的所属区域 uploads/accepted 原件启动简历结构化解析
      description: |
        追踪 TASK-013、FR-002、FR-003、SEC-040、NFR-015。仅可读取当前用户所属数据区、
        已由 TASK-012 接受的上传；调用供应商中立解析适配层前移除电话、邮箱、证件、详细地址、
        照片及保护属性。输出经 resume-profile JSON Schema 和递归敏感内容门槛校验后，才追加
        未确认版本。相同 Idempotency-Key 不重复读取、调用模型或写版本。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeParseCommand'
      responses:
        '202':
          description: 解析任务已受理或返回同一幂等结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeParseTask' }
        '409':
          description: 幂等键输入冲突、上传未安全接受、跨用户或跨数据区
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/parsing/resumes/{resumeId}:
    get:
      tags: [parsing]
      operationId: getResumeParseTask
      summary: 查询解析真实状态、影响和当前追加式版本
      parameters:
        - $ref: '#/components/parameters/ResumeId'
      responses:
        '200':
          description: 当前解析状态；暂时失败明确说明原件保留、可重试、不计费且不影响评分
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeParseTask' }
        default: { $ref: '#/components/responses/Error' }
  /v1/parsing/resumes/{resumeId}:retry:
    post:
      tags: [parsing]
      operationId: retryResumeParseTask
      summary: 复用 uploads/accepted 保留原件，只重试失败的解析步骤
      parameters:
        - $ref: '#/components/parameters/ResumeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 重试已受理；同一幂等键不重复调用适配层或写版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeParseTask' }
        '409':
          description: 当前任务不可重试
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/parsing/resumes/{resumeId}/versions/{version}:
    get:
      tags: [parsing]
      operationId: getParsedResumeVersion
      summary: 获取追加式简历结构化版本及低置信度路径
      parameters:
        - $ref: '#/components/parameters/ResumeId'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 安全面试画像；排除字段只含类别、永不含原值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedResumeVersion' }
        default: { $ref: '#/components/responses/Error' }
  /v1/parsing/resumes/{resumeId}/versions/{version}/fields:
    patch:
      tags: [parsing]
      operationId: editParsedResumeField
      summary: 一次编辑或确认一个字段并追加新草稿版本
      description: |
        JSON Pointer 只能指向 resume-profile 的面试安全可编辑字段。每次操作追加新版本，历史版本
        不可修改；电话、邮箱、证件、地址、照片、保护属性等键或值在写入前 fail-closed。
      parameters:
        - $ref: '#/components/parameters/ResumeId'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeFieldEdit' }
      responses:
        '200':
          description: 新追加的草稿版本；重复幂等键返回首次版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedResumeVersion' }
        '409':
          description: 基版本过期、版本已确认或幂等键冲突
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 字段路径非法、Schema 不通过或敏感内容硬门槛拒绝
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /v1/parsing/resumes/{resumeId}/versions/{version}:confirm:
    post:
      tags: [parsing]
      operationId: confirmParsedResumeVersion
      summary: 低置信度字段逐项校对完成后追加用户确认的冻结版本
      parameters:
        - $ref: '#/components/parameters/ResumeId'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已确认冻结；此后才允许用于计划、面试上下文或评分上游材料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedResumeVersion' }
        '409':
          description: 尚有低置信度字段未逐项校对，或基版本已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ============================== resumes ==============================
  /v1/resumes:
    post:
      tags: [resumes]
      operationId: uploadResume
      summary: 上传简历（.pdf/.doc/.docx，单文件 ≤10MB；损坏/加密/超限/伪装/恶意拒绝并给出具体原因）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 简历文件；在隔离环境解析 }
      responses:
        '201': { description: 上传成功，待解析, content: { application/json: { schema: { $ref: '#/components/schemas/Resume' } } } }
        '422': { description: 文件被拒绝（含具体原因：corrupted/encrypted/oversized/type_spoofed/unsafe）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [resumes]
      operationId: listResumes
      summary: 简历库列表
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 分页列表, content: { application/json: { schema: { $ref: '#/components/schemas/ResumePage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/resumes/{resumeId}:
    get:
      tags: [resumes]
      operationId: getResume
      summary: 获取简历元信息与当前确认版本
      parameters:
        - $ref: '#/components/parameters/ResumeId'
      responses:
        '200': { description: 简历详情, content: { application/json: { schema: { $ref: '#/components/schemas/Resume' } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [resumes]
      operationId: deleteResume
      summary: 删除简历（级联：结构化版本与对象存储原件；不影响已冻结项目的历史版本引用）
      parameters:
        - $ref: '#/components/parameters/ResumeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: 删除任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionTask' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/resumes/{resumeId}/parse:
    post:
      tags: [resumes]
      operationId: parseResume
      summary: 触发结构化解析（可重试失败步骤；P95 ≤60s @10MB，NFR-015）
      parameters:
        - $ref: '#/components/parameters/ResumeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: 解析任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncTask' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/resumes/{resumeId}/versions:
    get:
      tags: [resumes]
      operationId: listResumeVersions
      summary: 简历版本列表（历史版本全部保留）
      parameters:
        - $ref: '#/components/parameters/ResumeId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 版本分页, content: { application/json: { schema: { type: object, properties: { data_region: { $ref: '#/components/schemas/Region' }, items: { type: array, items: { $ref: '#/components/schemas/ResumeVersion' } }, next_cursor: { type: ['string', 'null'] } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/resumes/{resumeId}/versions/{version}:
    patch:
      tags: [resumes]
      operationId: editResumeVersion
      summary: 逐字段编辑（新增/修改/删除字段；低置信度标记；编辑产生新版本草稿）
      parameters:
        - $ref: '#/components/parameters/ResumeId'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_version, field_ops]
              properties:
                base_version: { type: integer, description: 乐观锁基版本 }
                field_ops:
                  type: array
                  items:
                    type: object
                    required: [op, path]
                    properties:
                      op: { enum: [add, replace, remove] }
                      path: { type: string, description: 字段路径（对应 resume-profile.schema.json） }
                      value: {}
      responses:
        '200': { description: 编辑后的版本草稿, content: { application/json: { schema: { $ref: '#/components/schemas/ResumeVersion' } } } }
        '409': { description: 版本冲突（基于最新版本重新编辑）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/resumes/{resumeId}/versions/{version}/confirm:
    post:
      tags: [resumes]
      operationId: confirmResumeVersion
      summary: 用户校对确认（确认后方可用于计划生成；写 resume_parse_confirmed）
      parameters:
        - $ref: '#/components/parameters/ResumeId'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 已确认并冻结该版本, content: { application/json: { schema: { $ref: '#/components/schemas/ResumeVersion' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== jobs ==============================
  /v1/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: 粘贴完整 JD 并保留原始输入（薪资福利与招聘联系人不进入评分上下文）
      description: |
        `jd_text` 按 L4 不可信数据保存和解析，不写日志。相同幂等键与相同不可变输入返回
        首次岗位；不同输入返回 409。解析失败或超时时原文保留，可只重试 `/parse` 步骤。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jd_text, language]
              properties:
                jd_text: { type: string, minLength: 1, description: 完整 JD 原文（视为不可信数据，仅结构化提取） }
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '201': { description: 已创建，待解析, content: { application/json: { schema: { $ref: '#/components/schemas/JobProfile' } } } }
        '409': { description: 幂等键被用于不同输入, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [jobs]
      operationId: listJobs
      summary: 岗位库列表
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 分页列表, content: { application/json: { schema: { type: object, properties: { data_region: { $ref: '#/components/schemas/Region' }, items: { type: array, items: { $ref: '#/components/schemas/JobProfile' } }, next_cursor: { type: ['string', 'null'] } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/jobs:infer-from-resume:
    post:
      tags: [jobs]
      operationId: createJobInferredFromResume
      summary: 仅有简历时引用已确认安全版本创建 AI 推导岗位
      description: |
        只读取 TASK-013 已确认且通过 SEC-040 的安全简历画像，不复制简历原文。生成的岗位
        `source_kind=resume_inference`，核心字段均登记在 `ai_derived_fields`，要求项及面试重点
        保留 `ai_inferred=true`，人工校对后仍不得移除来源标记。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resume_id, resume_version, language]
              properties:
                resume_id: { type: string, format: uuid }
                resume_version: { type: integer, minimum: 1, description: 必须是当前用户所属区域的已确认版本 }
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '201': { description: AI 推导岗位已创建，待解析与人工确认, content: { application/json: { schema: { $ref: '#/components/schemas/JobProfile' } } } }
        '409': { description: 简历版本未确认、跨用户/跨区或幂等冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/jobs/{jobId}/parse:
    post:
      tags: [jobs]
      operationId: parseJob
      summary: 触发或重试岗位结构化解析（AI 推导内容必须标记）
      description: |
        供应商中立适配层对 Schema/暂时错误自动重试不超过 2 次；仍失败返回
        `RETRYABLE_FAILURE`，保留原始输入且可用新幂等键只重试本步骤。失败不计费、不影响评分。
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: 解析任务状态；重复幂等键返回首次稳定结果, content: { application/json: { schema: { $ref: '#/components/schemas/JobParseTask' } } } }
        '409': { description: 当前状态不可解析或幂等键冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/jobs/{jobId}/versions/{version}:
    get:
      tags: [jobs]
      operationId: getJobVersion
      summary: 获取不可变岗位版本与 AI 推理标记
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: 岗位版本, content: { application/json: { schema: { $ref: '#/components/schemas/JobVersion' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [jobs]
      operationId: editJobVersion
      summary: 一次人工校对一个字段并追加新版本草稿
      description: |
        允许 add/replace/remove 安全画像字段。`ai_inferred`、`editable`、`inference_id` 与
        `ai_derived_fields` 为来源证明，不可删除或改写；编辑推理内容只将 `edited_by_user=true`。
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_version, path, operation]
              properties:
                base_version: { type: integer, minimum: 1, description: 必须等于 URL version 与最新版本 }
                path: { type: string, pattern: '^/' }
                operation: { enum: [add, replace, remove] }
                value: {}
      responses:
        '200': { description: 编辑后的版本草稿, content: { application/json: { schema: { $ref: '#/components/schemas/JobVersion' } } } }
        '409': { description: 基版本过期或幂等冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 字段越界、试图移除 AI 标记、Schema 失败或排除内容命中, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/jobs/{jobId}/versions/{version}/confirm:
    post:
      tags: [jobs]
      operationId: confirmJobVersion
      summary: 用户确认并追加冻结岗位版本；确认后方可用于计划与评分上游
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 已确认, content: { application/json: { schema: { $ref: '#/components/schemas/JobVersion' } } } }
        '409': { description: 基版本过期或幂等冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/jobs/material-readiness:assess:
    post:
      tags: [jobs]
      operationId: assessInterviewMaterialReadiness
      summary: 生成四种材料组合的功能影响弹窗快照
      description: |
        版本引用必须已人工确认。`full` 无需同意；`jd_only`、`resume_only`、`neither`
        返回完整功能缺失与评分限制，后续项目创建必须提交与该快照严格匹配的同意记录。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resume_id: { type: ['string', 'null'], format: uuid, description: 与 resume_version 同时提供；必须是已确认安全版本 }
                resume_version: { type: ['integer', 'null'], minimum: 1 }
                job_id: { type: ['string', 'null'], format: uuid, description: 与 job_version 同时提供；必须是已确认岗位版本 }
                job_version: { type: ['integer', 'null'], minimum: 1 }
      responses:
        '200': { description: 可直接呈现的影响弹窗快照, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialReadiness' } } } }
        '409': { description: 版本未确认、跨用户/跨区或幂等冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/jobs/degraded-consents:
    post:
      tags: [jobs]
      operationId: grantMaterialDegradationConsent
      summary: 对指定影响快照追加显式降级同意记录
      description: |
        仅 `accepted=true` 产生记录；false、缺省、快照不匹配或跨用户/跨区均拒绝。
        该记录是功能降级确认，不改变 `/consents` 的六类独立隐私授权。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assessment_id, accepted]
              properties:
                assessment_id: { type: string, format: uuid }
                accepted: { type: boolean, const: true }
      responses:
        '201': { description: 已追加显式同意；重复幂等键返回首次记录, content: { application/json: { schema: { $ref: '#/components/schemas/DegradedModeConsent' } } } }
        '409': { description: 未显式接受、快照不匹配或幂等冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== sources ==============================
  # 企业公开流程来源（TASK-015、FR-007/FR-008）。
  # 安全边界：外部网页内容仅作为不可信数据进入结构化提取，不得作为系统指令（SEC-024/SEC-025）；
  # 禁止绕过网站协议/登录/验证码/反爬；来源内容不得进入评分证据。
  /v1/sources/search:
    post:
      tags: [sources]
      operationId: searchProcessSources
      summary: 按公司/岗位/级别/地区检索公开面试流程来源；无可靠来源自动回退通用模板并标记 AI 推导
      description: |
        检索链路经供应商中立适配层（PROVIDER-ADAPTERS §4.5）；返回来源元数据
        （链接/日期/类型/可信度/失效状态）。无公司信息、检索故障或无可靠来源时
        自动回退通用岗位/级别模板，`flow_uses_generic_template=true` 且 `ai_derived=true`，
        不伪装企业流程（US-02 场景 2）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceSearchQuery' }
      responses:
        '200':
          description: 检索结果（来源元数据 + 回退标记）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceSearchResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sources:
    get:
      tags: [sources]
      operationId: listProcessSources
      summary: 来源库分页列表（按区域/岗位族/状态/失效筛选）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: job_family, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SourceStatus' } }
        - { name: include_expired, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: 分页列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourcePage' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sources/{sourceId}:
    get:
      tags: [sources]
      operationId: getProcessSource
      summary: 来源详情（链接/日期/类型/可信度/失效状态）
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: 来源详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessSource' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ============================== projects ==============================
  /v1/projects:
    post:
      tags: [projects]
      operationId: createProject
      summary: 创建面试项目（缺失材料时须先取得降级模式明确同意）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interview_language, degraded_mode]
              properties:
                resume_id: { type: ['string', 'null'], format: uuid }
                resume_version: { type: ['integer', 'null'], minimum: 1 }
                job_id: { type: ['string', 'null'], format: uuid }
                job_version: { type: ['integer', 'null'], minimum: 1 }
                interview_language: { $ref: '#/components/schemas/Language' }
                degraded_mode: { enum: [full, jd_only, resume_only, neither] }
                degraded_mode_consent_id: { type: ['string', 'null'], format: uuid, description: 非 full 时必填（明确同意记录） }
                assignment_id: { type: ['string', 'null'], format: uuid, description: 机构任务（可选） }
      responses:
        '201': { description: 项目已创建（DRAFT）, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [projects]
      operationId: listProjects
      summary: 项目列表（按公司、岗位、日期、语言、状态筛选；跨设备同步）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProjectStatus' } }
        - { name: company, in: query, schema: { type: string } }
        - { name: job_title, in: query, schema: { type: string } }
        - { name: interview_language, in: query, schema: { $ref: '#/components/schemas/Language' } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: 分页列表, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}:
    get:
      tags: [projects]
      operationId: getProject
      summary: 项目详情（状态、当前轮、下一动作）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: 项目详情, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [projects]
      operationId: renameProject
      summary: 重命名项目
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: 删除项目（活动项目明确说明将终止面试；级联删除报告、训练与媒体；真实进度）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: 删除任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionTask' } } } }
        '409': { description: 活动项目需先确认终止（state_conflict）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/duplicate:
    post:
      tags: [projects]
      operationId: duplicateProject
      summary: 复制项目（复用简历/JD 创建不同难度、语言或风格的独立项目）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                interview_language: { $ref: '#/components/schemas/Language' }
      responses:
        '201': { description: 新项目（DRAFT）, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== plans ==============================
  /v1/projects/{projectId}/plan:generate:
    post:
      tags: [plans]
      operationId: generatePlan
      summary: 生成个性化多轮计划（P95 ≤120s，NFR-016；来源元数据 + 安全检查通过才可用）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: 生成任务已创建（部分失败只重试失败模块）, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncTask' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/plan:
    get:
      tags: [plans]
      operationId: getPlan
      summary: 获取当前计划版本（含来源、可信度、轮次与权重；不展示正式问题）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: 计划详情, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [plans]
      operationId: editPlan
      summary: 编辑计划（轮次增删重排、角色、重点、难度、时长、风格、数字人、声音、工具；开始前；重新校验总权重与量表）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_plan_version, rounds]
              properties:
                base_plan_version: { type: integer, minimum: 1 }
                rounds:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { $ref: '#/components/schemas/RoundConfigInput' }
      responses:
        '200': { description: 新计划版本（未冻结）, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '409': { description: 已冻结不可修改（state_conflict）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/plan:confirm:
    post:
      tags: [plans]
      operationId: confirmPlan
      summary: 确认计划与额度（冻结量表、轮次权重、流程、问题覆盖方案与计费版本；写 plan_confirmed）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_version, accommodations]
              properties:
                plan_version: { type: integer, minimum: 1 }
                accommodations:
                  type: array
                  items: { enum: [text_only, mixed_input, slower_avatar_speech, repeat_questions, extended_time, silence_threshold_adjusted, no_proactive_interruption, reduced_motion, tool_keyboard_alternative] }
                quote_id: { type: ['string', 'null'], format: uuid, description: 付费项目的已确认报价 }
      responses:
        '200': { description: 已确认并冻结，项目进入 READY, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '422': { description: 计划不完整（某轮缺问题覆盖方案或量表），仅重试缺失部分, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== library (TASK-018) ==============================
  /v1/library/resumes:
    get:
      tags: [library]
      operationId: listResumeLibrary
      summary: 简历库列表（公司/岗位筛选；跨设备同步）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: company, in: query, schema: { type: string } }
        - { name: job_title, in: query, schema: { type: string } }
      responses:
        '200': { description: 简历库分页, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryResumePage' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [library]
      operationId: saveResumeToLibrary
      summary: 保存简历到简历库（幂等）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id, resume_version]
              properties:
                resume_id: { type: string, format: uuid }
                resume_version: { type: integer, minimum: 1 }
                company: { type: ['string', 'null'] }
                job_title: { type: ['string', 'null'] }
      responses:
        '201': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryResume' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/library/resumes/{resumeId}:
    delete:
      tags: [library]
      operationId: deleteResumeFromLibrary
      summary: 从简历库移除（材料本体删除归摄取服务）
      parameters:
        - { name: resumeId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已移除（不存在视为成功） }
        default: { $ref: '#/components/responses/Error' }
  /v1/library/jobs:
    get:
      tags: [library]
      operationId: listJobLibrary
      summary: 岗位库列表
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: company, in: query, schema: { type: string } }
        - { name: job_title, in: query, schema: { type: string } }
      responses:
        '200': { description: 岗位库分页, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryJobPage' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [library]
      operationId: saveJobToLibrary
      summary: 保存岗位到岗位库（幂等）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id, job_version]
              properties:
                job_id: { type: string, format: uuid }
                job_version: { type: integer, minimum: 1 }
                company: { type: ['string', 'null'] }
                job_title: { type: ['string', 'null'] }
      responses:
        '201': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryJob' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/library/jobs/{jobId}:
    delete:
      tags: [library]
      operationId: deleteJobFromLibrary
      summary: 从岗位库移除
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已移除（不存在视为成功） }
        default: { $ref: '#/components/responses/Error' }

  # ============================== preferences (TASK-018) ==============================
  /v1/me/preferences:
    get:
      tags: [account]
      operationId: getPreferences
      summary: 读取界面语言与面试语言独立配置（FR-028）
      responses:
        '200': { description: 偏好, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [account]
      operationId: updatePreferences
      summary: 更新界面语言与面试语言偏好（面试语言仍须按项目由用户确认）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== device (TASK-018) ==============================
  /v1/projects/{projectId}/device:claim:
    post:
      tags: [projects]
      operationId: claimActiveDevice
      summary: 认领活动设备；正式面试已被另一设备占用时返回 409 device_active（FR-030）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: string, minLength: 1 }
      responses:
        '200': { description: 已认领, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceClaimResult' } } } }
        '409': { description: 正式面试已在其他设备活动（device_active）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/device:transfer:
    post:
      tags: [projects]
      operationId: transferActiveDevice
      summary: 安全转移活动设备（确认后原设备会话失效；仅当前活动设备可发起）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_device_id, new_device_id]
              properties:
                current_device_id: { type: string }
                new_device_id: { type: string }
      responses:
        '200': { description: 已转移, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceTransferResult' } } } }
        '409': { description: 仅当前活动设备可发起（device_active）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/device:release:
    post:
      tags: [projects]
      operationId: releaseActiveDevice
      summary: 释放活动设备（结束会话/退出时调用）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: string }
      responses:
        '200': { description: 已释放, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceReleaseResult' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== sessions ==============================
  /v1/projects/{projectId}/rounds/{sequence}/session:
    post:
      tags: [sessions]
      operationId: createSession
      summary: 创建正式/重试轮次房间并签发短期房间令牌（与业务令牌隔离）
      description: |
        前置条件（全部满足，否则 state_conflict/insufficient_entitlement）：
        覆盖方案与量表就绪；第 2 轮起交接包（HandoffPackage，见
        `ai/schemas/handoff-package.schema.json` 与 docs/ai/HANDOFF-SPEC.md）就绪；
        额度预留成功；单活动设备；便利设置已冻结。
        房间令牌短期有效，仅用于媒体面；浏览器不持有任何供应商密钥。
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RoundSequence'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, device_id]
              properties:
                kind: { enum: [formal, formal_retry] }
                attempt_id: { type: ['string', 'null'], format: uuid, description: formal_retry 时必填 }
                device_id: { type: string, description: 单活动设备标识 }
      responses:
        '201': { description: 房间已创建, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreated' } } } }
        '402': { description: 额度不足（阻止开始并提供购买；面试中不提示余额）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 前置条件未满足或他设备活动（state_conflict）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: 会话状态（房间状态机、计时、计费秒数、当前回合）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: 会话详情, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/end:
    post:
      tags: [sessions]
      operationId: endSession
      summary: 用户主动退出（需确认；项目标记 EVALUATION_INCOMPLETE；按实际使用扣减）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, const: true }
      responses:
        '200': { description: 会话已结束, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/reconnect:
    post:
      tags: [sessions]
      operationId: reconnectSession
      summary: 重连会话（3 分钟窗口内恢复到最后已确认回合；不扣时间、不判失败）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, last_confirmed_room_seq]
              properties:
                device_id: { type: string }
                last_confirmed_room_seq: { type: integer, minimum: 0 }
      responses:
        '200': { description: 已重连（返回新的短期房间令牌）, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreated' } } } }
        '410': { description: 重连窗口已过（项目进入 EVALUATION_INCOMPLETE）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/device-transfer:
    post:
      tags: [sessions]
      operationId: transferSessionDevice
      summary: 安全转移会话到另一设备（用户确认；原设备令牌立即失效）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_device_id, confirm]
              properties:
                new_device_id: { type: string }
                confirm: { type: boolean, const: true }
      responses:
        '200': { description: 已转移（返回新设备短期房间令牌）, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreated' } } } }
        default: { $ref: '#/components/responses/Error' }
  # ---- TASK-023 双向字幕与转写修订（FR-018） ----
  /v1/sessions/{sessionId}/transcripts:
    post:
      tags: [sessions]
      operationId: appendTranscript
      summary: 追加 ASR 临时/最终字幕（partial 仅展示；final 为正式转写，回合冻结后拒绝追加）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turn_index, utterance_id, kind, text, language, confidence]
              properties:
                turn_index: { type: integer, minimum: 1 }
                utterance_id: { type: string, format: uuid }
                kind: { type: string, enum: [partial, final] }
                text: { type: string, minLength: 1 }
                language: { type: string }
                confidence: { type: number, minimum: 0, maximum: 1 }
      responses:
        '200': { description: 已追加/覆盖展示文本, content: { application/json: { schema: { $ref: '#/components/schemas/Transcript' } } } }
        '409': { description: 回合已冻结（revision_window_closed）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [sessions]
      operationId: listTranscripts
      summary: 会话全部字幕与转写（原始 ASR 与修订双版本；原始仅诊断）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 字幕列表（按 created_at 升序）
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Transcript' } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/revisions:
    post:
      tags: [sessions]
      operationId: submitTranscriptRevision
      summary: 提交转写修订（transcript.revision.submitted；进入下一主问题后一律 rejected(window_closed)）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision_id, utterance_id, turn_index, revised_text]
              properties:
                revision_id: { type: string, format: uuid }
                utterance_id: { type: string, format: uuid }
                turn_index: { type: integer, minimum: 1 }
                revised_text: { type: string, minLength: 1 }
      responses:
        '200': { description: 修订已提交（冻结后随回合升级为 accepted）, content: { application/json: { schema: { $ref: '#/components/schemas/Transcript' } } } }
        '409': { description: 修订窗口已关闭（revision_window_closed）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/turns/{turnIndex}/freeze:
    post:
      tags: [sessions]
      operationId: freezeTurn
      summary: 冻结回合（turn.completed；上一有效回答已持久化后发出；冻结后修订窗口关闭）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: turnIndex, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 回合已冻结（含 final/修订计数）
          content:
            application/json:
              schema:
                type: object
                required: [session_id, turn_index, frozen_at, final_count, revised_count]
                properties:
                  session_id: { type: string, format: uuid }
                  turn_index: { type: integer }
                  frozen_at: { type: string, format: date-time }
                  final_count: { type: integer }
                  revised_count: { type: integer }
        '409': { description: 回合已冻结或状态冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/turns/{turnIndex}:
    get:
      tags: [sessions]
      operationId: getTurnState
      summary: 回合冻结状态（客户端续传游标）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - { name: turnIndex, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 回合状态
          content:
            application/json:
              schema:
                type: object
                required: [session_id, turn_index, frozen]
                properties:
                  session_id: { type: string, format: uuid }
                  turn_index: { type: integer }
                  frozen: { type: boolean }
                  frozen_at: { type: ['string', 'null'], format: date-time }
        default: { $ref: '#/components/responses/Error' }
  # ---- TASK-024 岗位工具（FR-019） ----
  /v1/sessions/{sessionId}/tools:
    get:
      tags: [sessions]
      operationId: listToolEvents
      summary: 会话工具事件（入证据账本；供报告与复核引用）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 工具事件列表（按 created_at 升序）
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ToolEvent' } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/tools/{toolKey}/activate:
    post:
      tags: [sessions]
      operationId: activateSessionTool
      summary: 激活岗位工具（tool.activated；仅允许计划中已配置工具，正式房间不临时加载）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - { name: toolKey, in: path, required: true, schema: { type: string, enum: [code_editor, whiteboard, case_materials, portfolio] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                preconfig_ref: { type: string, description: 计划冻结时配置引用 }
      responses:
        '200':
          description: 已激活
          content:
            application/json:
              schema:
                type: object
                required: [session_id, tool_key, activated_at]
                properties:
                  session_id: { type: string, format: uuid }
                  tool_key: { type: string }
                  preconfig_ref: { type: string }
                  activated_at: { type: string, format: date-time }
        '409': { description: 未配置工具（tool_not_configured）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/tools/{toolKey}/events:
    post:
      tags: [sessions]
      operationId: recordToolEvent
      summary: 记录工具事件（tool.event；幂等键 tool_event_id；事件入证据账本）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: toolKey, in: path, required: true, schema: { type: string, enum: [code_editor, whiteboard, case_materials, portfolio] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_event_id, event_type, content_ref]
              properties:
                tool_event_id: { type: string, format: uuid }
                event_type: { type: string, enum: [edit, run, annotate, submit] }
                content_ref: { type: string, description: 对象存储引用，非内联大对象 }
      responses:
        '200': { description: 事件已入库, content: { application/json: { schema: { $ref: '#/components/schemas/ToolEvent' } } } }
        '409': { description: 未配置工具或会话状态冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  # ---- TASK-025 故障暂停与文字降级（FR-020） ----
  /v1/sessions/{sessionId}/timer/pause:
    post:
      tags: [sessions]
      operationId: pauseSessionTimer
      summary: 暂停计时（timer.paused；系统故障/重连/令牌暂停；暂停段不计费不影响评分）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [system_fault, reconnect, auth_paused] }
      responses:
        '200': { description: 已暂停, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '409': { description: 状态冲突或会话已结束, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/timer/resume:
    post:
      tags: [sessions]
      operationId: resumeSessionTimer
      summary: 恢复计时（timer.resumed；累计暂停秒数；恢复 LIVE）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 已恢复, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '409': { description: 未处于暂停态（timer_not_paused）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/downgrade/offer:
    post:
      tags: [sessions]
      operationId: offerTextDowngrade
      summary: 数字人持续故障时询问是否降级文字面试（avatar.downgrade_prompted；幂等返回同一 prompt_id）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已发起询问
          content:
            application/json:
              schema:
                type: object
                required: [prompt_id]
                properties:
                  prompt_id: { type: string, format: uuid }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/downgrade/accept:
    post:
      tags: [sessions]
      operationId: acceptTextDowngrade
      summary: 同意降级（TEXT_DEGRADED；故障点起不计数字人额度；口语项按文字模式规则）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt_id]
              properties:
                prompt_id: { type: string, format: uuid }
      responses:
        '200': { description: 已降级, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/downgrade/decline:
    post:
      tags: [sessions]
      operationId: declineTextDowngrade
      summary: 拒绝降级（ENDED；项目 EVALUATION_INCOMPLETE 不是失败；系统责任全额返还预留额度）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt_id]
              properties:
                prompt_id: { type: string, format: uuid }
      responses:
        '200': { description: 已结束（评估未完成）, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        default: { $ref: '#/components/responses/Error' }
  # ---- TASK-027 会前检查与输入模式冻结（FR-015/FR-016） ----
  /v1/sessions/{sessionId}/precheck/freeze:
    post:
      tags: [sessions]
      operationId: freezeSessionPreCheck
      summary: 冻结会前配置（session.pre_check_passed；摄像头/麦克风可关，数字人音视频始终开启；冻结后不可修改）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input_modes, accommodations, device_report]
              properties:
                input_modes: { type: array, minItems: 1, items: { type: string, enum: [voice, text, camera, job_tool] } }
                accommodations: { type: array, items: { type: string, enum: [text_only, mixed_input, slower_avatar_speech, repeat_questions, extended_time, silence_threshold_adjusted, no_proactive_interruption, reduced_motion, tool_keyboard_alternative] } }
                device_report:
                  type: object
                  required: [camera_ok, mic_ok, network_rated]
                  properties:
                    camera_ok: { type: boolean }
                    mic_ok: { type: boolean }
                    network_rated: { type: string, enum: [good, fair, poor] }
      responses:
        '200': { description: 已冻结（会话进入 AVATAR_CONNECTING）, content: { application/json: { schema: { $ref: '#/components/schemas/PreCheck' } } } }
        '409': { description: 已冻结或状态冲突（precheck_frozen/state_conflict）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{sessionId}/precheck:
    get:
      tags: [sessions]
      operationId: getSessionPreCheck
      summary: 会前冻结配置（输入模式/便利设置/设备报告）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: 会前配置, content: { application/json: { schema: { $ref: '#/components/schemas/PreCheck' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== scores ==============================
  /v1/projects/{projectId}/rounds/{sequence}/result:
    get:
      tags: [scores]
      operationId: getRoundResult
      summary: 当前轮最新有效评分结果（含门槛判定、弱项、解释与输入模式标注）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RoundSequence'
      responses:
        '200': { description: 评分结果（结构对齐 scoring-result.schema.json）, content: { application/json: { schema: { $ref: '#/components/schemas/ScoreResult' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/rounds/{sequence}/scores:
    get:
      tags: [scores]
      operationId: listScoreVersions
      summary: 评分版本历史（追加式；全部版本保留）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RoundSequence'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 版本分页, content: { application/json: { schema: { type: object, properties: { data_region: { $ref: '#/components/schemas/Region' }, items: { type: array, items: { $ref: '#/components/schemas/ScoreResult' } }, next_cursor: { type: ['string', 'null'] } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/rounds/{sequence}/review:
    post:
      tags: [scores]
      operationId: requestFormalReview
      summary: 正式复核（每次正式尝试仅一次；冻结证据+量表+权重重算；展示前后结果与原因）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RoundSequence'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, scope]
              properties:
                attempt_id: { type: string, format: uuid }
                scope: { enum: [question, dimension, round], description: 复核范围声明（计算均基于完整冻结输入） }
      responses:
        '202': { description: 复核完成（同步重算；产生新 ScoreVersion，附前后对比）, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewAccepted' } } } }
        '409': { description: 本次尝试已复核过（state_conflict）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== reports ==============================
  /v1/projects/{projectId}/report:
    get:
      tags: [reports]
      operationId: getReport
      summary: 获取完整或部分报告（六维雷达+文字等价、岗位匹配、逐题证据、训练计划）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: 报告（结构对齐 report.schema.json；模块级状态）, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/report:regenerate:
    post:
      tags: [reports]
      operationId: regenerateReportModule
      summary: 局部失败模块重试（不丢失评分证据；FR-026）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modules]
              properties:
                modules:
                  type: array
                  minItems: 1
                  items: { enum: [overview, radar, job_match, rounds, communication_analysis, tool_performance, training_plan] }
      responses:
        '202': { description: 重新生成任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncTask' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/report/export:
    post:
      tags: [reports]
      operationId: exportReport
      summary: 导出报告（必带“模拟训练结果，不代表真实企业录用结论”标记）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { enum: [pdf, json], default: pdf }
      responses:
        '202': { description: 导出任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncTask' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== practice ==============================
  /v1/projects/{projectId}/practice:
    post:
      tags: [practice]
      operationId: startPractice
      summary: 开始非评分练习（原题/变体；永不改变正式分数或解锁状态）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [practice_type, target_dimensions]
              properties:
                practice_type: { enum: [original_question, variant, framework, example] }
                target_dimensions:
                  type: array
                  items: { $ref: '#/components/schemas/DimensionKey' }
      responses:
        '201': { description: 练习会话已创建（独立证据链）, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/practice/{practiceId}/end:
    post:
      tags: [practice]
      operationId: endPractice
      summary: 结束练习（正式分数与解锁状态不变）
      parameters:
        - name: practiceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 练习已结束, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== retries ==============================
  /v1/projects/{projectId}/rounds/{sequence}/retry:
    post:
      tags: [retries]
      operationId: startFormalRetry
      summary: 发起正式重试（新题针对失败/未覆盖点；维度锁定生效；权益校验）
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RoundSequence'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: 重试尝试已创建（RETRY_SCHEDULED；新问题生成中）, content: { application/json: { schema: { $ref: '#/components/schemas/RetryAttempt' } } } }
        '402': { description: 无可用重试权益, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 当前轮状态不允许重试（state_conflict）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== billing ==============================
  /v1/entitlements:
    get:
      tags: [billing]
      operationId: listEntitlements
      summary: 当前权益与余额（免费 60 分钟、项目包、Pro、加油包）
      responses:
        '200': { description: 权益列表, content: { application/json: { schema: { type: object, properties: { data_region: { $ref: '#/components/schemas/Region' }, items: { type: array, items: { $ref: '#/components/schemas/Entitlement' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/quotes:
    post:
      tags: [billing]
      operationId: createQuote
      summary: 生成完整报价（轮次/时长/数字人规格/重试/税费/有效期；开始前修改重新报价）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, plan_version]
              properties:
                project_id: { type: string, format: uuid }
                plan_version: { type: integer, minimum: 1 }
      responses:
        '201': { description: 报价已生成, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orders:
    post:
      tags: [billing]
      operationId: createOrder
      summary: 创建订单（幂等键去重；同一订单只记一次权益和一次扣款）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id, payment_method]
              properties:
                quote_id: { type: string, format: uuid }
                payment_method: { type: string, description: 区域化支付方式标识（供应商中立） }
                auto_renew_consent: { type: boolean, default: false, description: 自动续费须单独勾选 }
      responses:
        '201': { description: 订单已创建（PAYMENT_PENDING）, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orders/{orderId}:
    get:
      tags: [billing]
      operationId: getOrder
      summary: 订单状态（含处理中状态的真实进度）
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 订单详情, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orders/{orderId}/invoice:
    get:
      tags: [billing]
      operationId: getInvoice
      summary: 发票/收据（中国区合规发票；国际区税费明示收据）
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 票据详情, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { description: 未开票, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [billing]
      operationId: issueInvoice
      summary: 为已支付订单开票/开收据（幂等；同一订单一份）
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: 已开票, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orders/{orderId}/invoice/cancel:
    post:
      tags: [billing]
      operationId: cancelInvoice
      summary: 作废发票（中国区合规；仅 issued 可作废；收据不可作废）
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: 已作废, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/pricing/{region}:
    get:
      tags: [billing]
      operationId: getRegionalPricing
      summary: 区域定价配置（币种、每分钟价格、税率、票据类型）
      parameters:
        - name: region
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Region' }
      responses:
        '200': { description: 区域定价, content: { application/json: { schema: { $ref: '#/components/schemas/RegionalPricing' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/usage-ledger:
    get:
      tags: [billing]
      operationId: listUsageLedger
      summary: 逐笔账单（项目/轮次/使用秒数/返还原因/余额快照）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 账本分页, content: { application/json: { schema: { type: object, properties: { data_region: { $ref: '#/components/schemas/Region' }, items: { type: array, items: { $ref: '#/components/schemas/UsageLedgerEntry' } }, next_cursor: { type: ['string', 'null'] } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/refunds:
    post:
      tags: [billing]
      operationId: requestRefund
      summary: 申请退款（系统故障自动执行；大额或人工补偿双人审批；不影响评分与解锁）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, reason]
              properties:
                order_id: { type: string, format: uuid }
                reason: { type: string }
                kind: { enum: [user_request, system_fault, compensation], default: user_request }
      responses:
        '201': { description: 退款已受理（小额/系统故障直接 REFUNDED；大额进入 REFUND_REVIEWING）, content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/refunds/{refundId}/approve:
    post:
      tags: [billing]
      operationId: approveRefund
      summary: 双人审批（两名不同审批人后自动执行；同一审批人重复无效）
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approver_id]
              properties:
                approver_id: { type: string, description: 审批人身份（后台令牌注入，禁止自批） }
      responses:
        '200': { description: 审批结果, content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/refunds/{refundId}/reject:
    post:
      tags: [billing]
      operationId: rejectRefund
      summary: 拒绝退款并说明原因（用户可申诉）
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: 已拒绝, content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/refunds/{refundId}/appeal:
    post:
      tags: [billing]
      operationId: appealRefund
      summary: 被拒后退款申诉（重新进入审批；仅本人可申诉）
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: 已重新进入审批, content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/subscription:
    get:
      tags: [billing]
      operationId: getSubscription
      summary: 当前订阅（月度时长、结转、账期）
      responses:
        '200': { description: 订阅详情, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '404': { description: 无订阅, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/subscription/cancel:
    post:
      tags: [billing]
      operationId: cancelSubscription
      summary: 取消续费（权益保留至账期结束；到期不删历史；进行中轮次可完成）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 已取消续费, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/subscription/auto-renew:
    put:
      tags: [billing]
      operationId: setAutoRenew
      summary: 自动续费单独勾选（必须明确同意；记录同意时的月额度与价格条款；条款变化须重新同意）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                consent_granted: { type: boolean, description: 开启时必须为 true }
                consent_monthly_seconds: { type: ['integer', 'null'], minimum: 1 }
                consent_price_cents: { type: ['integer', 'null'], minimum: 0 }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/subscription/renewals:
    post:
      tags: [billing]
      operationId: prepareRenewal
      summary: 续费扣款前提醒（自动续费已勾选且条款未变化；同一账期只生成一条提醒）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { description: 提醒已生成, content: { application/json: { schema: { $ref: '#/components/schemas/RenewalRecord' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/subscription/renewals/{renewalId}/charge:
    post:
      tags: [billing]
      operationId: chargeRenewal
      summary: 执行续费扣款（提醒后 7 天窗口内；结转 ≤1 账期；总余额 ≤2×月额度）
      parameters:
        - name: renewalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 续费成功, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/payments/callback/{provider}:
    post:
      tags: [billing]
      operationId: paymentCallback
      summary: 支付服务商回调（签名验证 + 时间戳重放窗口 + payment_event_id 去重；服务端到服务端）
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, description: 供应商中立标识，如 psp_cn_primary }
        - name: X-Provider-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Provider-Timestamp
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_event_id, order_id, event_type, data_region]
              properties:
                payment_event_id: { type: string, description: 支付侧事件唯一 ID（幂等去重） }
                order_id: { type: string, format: uuid }
                event_type: { enum: [payment_succeeded, payment_failed, refund_succeeded] }
                data_region: { $ref: '#/components/schemas/Region' }
                payload: { type: object, additionalProperties: true }
      responses:
        '200': { description: 已受理（重复事件返回相同应答，无副作用） }
        '401': { description: 签名验证失败或重放窗口外, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== organizations ==============================
  /v1/orgs:
    post:
      tags: [organizations]
      operationId: createOrg
      summary: 创建机构租户（角色分离：所有者/管理员/指导老师/隐私审计/财务/求职者）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201': { description: 机构已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}:
    get:
      tags: [organizations]
      operationId: getOrg
      summary: 机构详情（按调用者角色过滤可见字段）
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200': { description: 机构详情, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/invitations/{invitationId}/accept:
    post:
      tags: [organizations]
      operationId: acceptOrgInvitation
      summary: 用户以个人账户接受邀请加入（无影子账户；过期/停用拒绝）
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: 已加入, content: { application/json: { schema: { $ref: '#/components/schemas/OrgMember' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/members:
    get:
      tags: [organizations]
      operationId: listOrgMembers
      summary: 机构成员列表（owner/admin/instructor 可看）
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200': { description: 成员列表, content: { application/json: { schema: { type: object, properties: { data_region: { $ref: '#/components/schemas/Region' }, items: { type: array, items: { $ref: '#/components/schemas/OrgMember' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/members/{userId}/role:
    post:
      tags: [organizations]
      operationId: setOrgMemberRole
      summary: 调整成员角色（owner 仅本人可变更；写审计）
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { enum: [owner, admin, instructor, privacy_auditor, finance, candidate] }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/OrgMember' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/leave:
    post:
      tags: [organizations]
      operationId: leaveOrg
      summary: 退出机构（个人记录保留；机构访问立即失效由 TASK-074 挂接）
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '204': { description: 已退出 }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/status:
    post:
      tags: [organizations]
      operationId: setOrgStatus
      summary: 机构停用/启用/注销（owner；停用后成员令牌与共享链接失效）
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { enum: [active, suspended, deactivated] }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/members/invite:
    post:
      tags: [organizations]
      operationId: inviteOrgMember
      summary: 邀请成员（邀请链接/机构邮箱/批量名单/SSO/SCIM；用户以个人账户加入，无影子账户）
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_method, role]
              properties:
                invite_method: { enum: [link, org_email, bulk_list, sso, scim] }
                role: { enum: [owner, admin, instructor, privacy_auditor, finance, candidate] }
                email: { type: ['string', 'null'], format: email }
      responses:
        '201': { description: 邀请已创建（加入前展示机构名称、可见数据、期限与退出影响） }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/assignments:
    post:
      tags: [organizations]
      operationId: createAssignment
      summary: 创建训练任务（可配岗位/轮次/语言/工具/截止时间/练习次数/机构额度；不得改 60 分线、量表、证据规则、解锁与复核）
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, deadline_at]
              properties:
                title: { type: string }
                job_category: { type: ['string', 'null'] }
                round_template: { type: object, additionalProperties: true, description: 轮次/角色/时长/难度/语言/工具模板（平台硬性限制由服务端强制） }
                deadline_at: { type: string, format: date-time }
                max_practice_count: { type: ['integer', 'null'], minimum: 0 }
                org_credit_seconds: { type: ['integer', 'null'], minimum: 0 }
      responses:
        '201': { description: 任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }
        '422': { description: 模板试图修改及格线/量表/证据规则（拒绝并写审计）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/assignments/{assignmentId}:
    get:
      tags: [organizations]
      operationId: getAssignment
      summary: 任务完成情况（默认仅状态：接受/未开始/进行中/已完成/退出、完成时间、系统故障、机构额度消耗；拒绝分享时只显示“已完成但未共享结果”）
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200': { description: 任务详情（默认最小可见）, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/assignments/{assignmentId}/publish:
    post:
      tags: [organizations]
      operationId: publishAssignment
      summary: 发布训练任务（draft → published；写审计）
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200': { description: 已发布, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/assignments/{assignmentId}/close:
    post:
      tags: [organizations]
      operationId: closeAssignment
      summary: 关闭训练任务（published → closed；写审计）
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200': { description: 已关闭, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/assignments/{assignmentId}/shares:
    post:
      tags: [organizations]
      operationId: grantAssignmentShare
      summary: 用户针对具体任务授权分享结果（范围、有效期、可撤回；写入 ConsentGrant）
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_categories, expires_at]
              properties:
                data_categories:
                  type: array
                  minItems: 1
                  items: { enum: [total_score, radar, round_results, full_report, transcript, media] }
                expires_at: { type: string, format: date-time }
      responses:
        '201': { description: 授权已创建, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentGrant' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/assignments/{assignmentId}/shares/{shareId}:
    delete:
      tags: [organizations]
      operationId: revokeAssignmentShare
      summary: 撤回分享授权（在线访问立即失效；写 AccessAudit）
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - name: shareId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已撤回 }
        default: { $ref: '#/components/responses/Error' }
  /v1/orgs/{orgId}/aggregates:
    get:
      tags: [organizations]
      operationId: getOrgAggregates
      summary: 聚合分析（岗位类别/能力维度/完成率/提升趋势；细分群体 <10 人不展示；无个人排名/搜索）
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - { name: job_category, in: query, schema: { type: string } }
        - { name: dimension, in: query, schema: { $ref: '#/components/schemas/DimensionKey' } }
      responses:
        '200': { description: 聚合结果（不足 10 人的细分返回 hidden 标记）, content: { application/json: { schema: { $ref: '#/components/schemas/AggregateResult' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== deletion ==============================
  /v1/deletion-tasks:
    post:
      tags: [deletion]
      operationId: createDeletionTask
      summary: 创建删除任务（单次面试级联：报告、练习、重试、媒体；覆盖缓存、索引、对象存储与第三方处理器）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type: { enum: [project, resume, job, account] }
                target_id: { type: string, format: uuid }
      responses:
        '202': { description: 删除任务已创建, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionTask' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/deletion-tasks/{taskId}:
    get:
      tags: [deletion]
      operationId: getDeletionTask
      summary: 删除任务真实进度（数据库/缓存/索引/对象存储/备份/第三方逐项状态）
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 删除进度, content: { application/json: { schema: { $ref: '#/components/schemas/DeletionTask' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ============================== admin ==============================
  /v1/admin/providers:
    get:
      tags: [admin]
      operationId: listProviders
      summary: 供应商与模型注册表（按区域、语言、能力；默认仅匿名技术指标）
      responses:
        '200': { description: 供应商列表（不展示完整密钥）, content: { application/json: { schema: { type: object, properties: { data_region: { $ref: '#/components/schemas/Region' }, items: { type: array, items: { $ref: '#/components/schemas/ProviderInfo' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/providers/{providerId}/status:
    put:
      tags: [admin]
      operationId: updateProviderStatus
      summary: 供应商状态变更（灰度/禁用；紧急停用后新会话按区域规则切换已验证替代；活跃会话按冻结/故障恢复规则）
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { enum: [active, ramping, disabled] }
                ramp_percent: { type: ['integer', 'null'], minimum: 0, maximum: 100 }
                reason: { type: string, description: 故障切换必须记录原因 }
      responses:
        '200': { description: 已更新（写审计与 Incident） }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/rubrics:
    get:
      tags: [admin]
      operationId: listRubrics
      summary: 量表版本列表（维度、权重边界、锚点、门槛全部版本化）
      responses:
        '200': { description: 量表版本列表 }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/rubrics/{rubricId}/deprecate:
    post:
      tags: [admin]
      operationId: deprecateRubric
      summary: 停用存在系统性偏差的量表版本（受影响项目标记“评估待复核”并提供免费重试；不批量改写历史分数）
      parameters:
        - name: rubricId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, approvals]
              properties:
                reason: { type: string }
                approvals:
                  type: array
                  minItems: 3
                  description: 产品、面试专业、安全/公平性三方审批
                  items:
                    type: object
                    required: [role, approver_id]
                    properties:
                      role: { enum: [product, interview_professional, safety_fairness] }
                      approver_id: { type: string }
      responses:
        '202': { description: 停用任务已创建（受影响项目标记与免费重试为异步）, content: { application/json: { schema: { $ref: '#/components/schemas/AsyncTask' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/admin/audit-logs:
    get:
      tags: [admin]
      operationId: listAuditLogs
      summary: 追加式审计日志查询（管理员不可删除；默认脱敏）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: 审计分页, content: { application/json: { schema: { type: object, properties: { data_region: { $ref: '#/components/schemas/Region' }, items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }, next_cursor: { type: ['string', 'null'] } } } } } }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 业务 JWT，含 user_id 与 data_region claim；与媒体房间令牌相互隔离

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键（UUID 推荐）；相同键重复提交返回首个结果
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdentityChallengeId:
      name: challengeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: ['string', 'null'] }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ResumeId: { name: resumeId, in: path, required: true, schema: { type: string, format: uuid } }
    UploadId: { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    OrgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    RoundSequence: { name: sequence, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
    SourceId: { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 触发频率限制
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Region:
      enum: [cn, eu, intl]
      description: 数据区域（三数据区相互隔离，不为容灾擅自跨境）
    Language:
      enum: [zh-CN, en-US]
      description: 首发语言；界面语言与面试语言相互独立
    DimensionKey:
      enum: [professional_competence, problem_solving, communication, experience_evidence, behavioral_collaboration, learning_adaptability]
    ProjectStatus:
      enum: [DRAFT, PARSING, MATERIAL_REVIEW, PARSE_FAILED, PLAN_GENERATING, PLAN_REVIEW, PLAN_FAILED, READY, IN_SESSION, SCORING, ROUND_PASSED, ROUND_FAILED, PRACTICING, EVALUATION_INCOMPLETE, COMPLETED]
    ResultStatus:
      enum: [PASS, FAIL, EVALUATION_INCOMPLETE]
      description: 评估未完成 ≠ 失败
    ErrorCode:
      enum: [unauthorized, forbidden, not_found, conflict, validation_failed, upload_rejected, scan_retryable, parse_retryable, sensitive_content_rejected, low_confidence_unresolved, idempotency_conflict, rate_limited, risk_verification_required, verification_invalid, verification_expired, identity_conflict, provider_unavailable, region_mismatch, insufficient_entitlement, state_conflict, device_active, internal]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id, data_region]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 用户可见错误（说明影响、数据是否保留、可重试动作、是否计费、是否影响评分） }
            details: { type: ['object', 'null'], additionalProperties: true }
            trace_id: { type: string }
            data_region: { $ref: '#/components/schemas/Region' }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: 最小货币单位（分/cent） }
        currency: { type: string, example: CNY }
    IdentityProvider:
      enum: [email_otp, google, apple, wechat]
      description: 登录身份提供商；手机号码不是必填身份
    IdentityVerificationChallenge:
      type: object
      required: [challenge_id, expires_at, delivery_status, data_region]
      properties:
        challenge_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        retry_after_seconds: { type: integer, minimum: 0 }
        delivery_status: { enum: [accepted] }
        data_region: { $ref: '#/components/schemas/Region' }
    IdentityVerificationProof:
      type: object
      required: [proof_token, provider, expires_at, data_region]
      properties:
        proof_token: { type: string, minLength: 32, description: 短期单次证明；不得写日志或持久化明文 }
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        expires_at: { type: string, format: date-time }
        data_region: { $ref: '#/components/schemas/Region' }
    IdentityRegistration:
      type: object
      required: [ui_language, age_status, terms_version, privacy_version, data_processing_version, accepted_at, acceptance_context]
      properties:
        ui_language: { $ref: '#/components/schemas/Language' }
        age_status: { enum: [adult, minor_guardian_verified, minor_pending], description: 未满 16 岁仅可使用无登录样例演示 }
        terms_version: { type: string, minLength: 1 }
        privacy_version: { type: string, minLength: 1 }
        data_processing_version: { type: string, minLength: 1 }
        accepted_at: { type: string, format: date-time }
        acceptance_context:
          type: object
          required: [ui_language, surface]
          properties:
            ui_language: { $ref: '#/components/schemas/Language' }
            surface: { enum: [web, pwa, mobile_web] }
          additionalProperties: false
      additionalProperties: false
    IdentityBinding:
      type: object
      required: [identity_id, provider, verified_at, data_region]
      properties:
        identity_id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        verified_at: { type: string, format: date-time }
        data_region: { $ref: '#/components/schemas/Region' }
    IdentitySession:
      type: object
      required: [session_id, access_token, refresh_token, token_type, expires_in, refresh_expires_in, account, data_region]
      properties:
        session_id: { type: string, format: uuid }
        access_token: { type: string, description: 业务 JWT；禁止写日志 }
        refresh_token: { type: string, description: 单次轮换刷新令牌；禁止写日志 }
        token_type: { const: Bearer }
        expires_in: { type: integer, minimum: 1 }
        refresh_expires_in: { type: integer, minimum: 1 }
        account: { $ref: '#/components/schemas/Account' }
        data_region: { $ref: '#/components/schemas/Region' }
    Account:
      type: object
      required: [user_id, data_region, ui_language, age_status, status]
      properties:
        user_id: { type: string, format: uuid }
        data_region: { $ref: '#/components/schemas/Region' }
        ui_language: { $ref: '#/components/schemas/Language' }
        age_status: { enum: [adult, minor_guardian_verified, minor_pending], description: 未满 16 岁在创建账户前即拒绝，仅可无登录样例演示 }
        status: { enum: [active, deletion_pending, deleted_anonymized] }
        display_name: { type: ['string', 'null'] }
        identities:
          type: array
          items: { $ref: '#/components/schemas/IdentityBinding' }
    ConsentGrant:
      type: object
      required: [grant_id, consent_type, scope, scope_hash, status, granted_at, evidence, version, recorded_at, data_region]
      properties:
        grant_id: { type: string, format: uuid }
        consent_type: { enum: [core_service, raw_av_recording, org_sharing, product_analytics, model_training, marketing] }
        scope: { $ref: '#/components/schemas/ConsentScope' }
        scope_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { enum: [granted, withdrawn, expired] }
        granted_at: { type: string, format: date-time }
        expires_at: { type: ['string', 'null'], format: date-time }
        withdrawn_at: { type: ['string', 'null'], format: date-time }
        supersedes_grant_id: { type: ['string', 'null'], format: uuid }
        evidence: { $ref: '#/components/schemas/ConsentEvidence' }
        version: { type: integer, minimum: 1 }
        recorded_at: { type: string, format: date-time }
        data_region: { $ref: '#/components/schemas/Region' }
    ConsentScope:
      type: object
      additionalProperties: false
      properties:
        assignment_id: { type: ['string', 'null'], format: uuid, description: 仅 org_sharing 使用 }
        data_categories:
          type: array
          uniqueItems: true
          items: { enum: [total_score, radar, round_results, full_report, transcript, media] }
        media_categories:
          type: array
          uniqueItems: true
          items: { enum: [audio, video] }
        channels:
          type: array
          uniqueItems: true
          items: { enum: [email, in_app, push] }
    ConsentUIContext:
      type: object
      additionalProperties: false
      required: [surface, flow, ui_language]
      properties:
        surface: { enum: [web, ios, android] }
        flow: { enum: [registration, consent_center, interview_room, assignment_share] }
        ui_language: { $ref: '#/components/schemas/Language' }
    ConsentEvidenceInput:
      type: object
      additionalProperties: false
      required: [copy_version, privacy_policy_version, presented_at, ui_context]
      properties:
        copy_version: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        privacy_policy_version: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        presented_at: { type: string, format: date-time }
        ui_context: { $ref: '#/components/schemas/ConsentUIContext' }
    ConsentEvidence:
      type: object
      additionalProperties: false
      required: [copy_version, privacy_policy_version, presented_at, ui_context, action, recorded_at, evidence_hash]
      properties:
        copy_version: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        privacy_policy_version: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        presented_at: { type: string, format: date-time }
        ui_context: { $ref: '#/components/schemas/ConsentUIContext' }
        action: { enum: [grant, withdraw] }
        recorded_at: { type: string, format: date-time }
        evidence_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
    ConsentGrantRequest:
      type: object
      additionalProperties: false
      required: [scope, evidence]
      properties:
        scope: { $ref: '#/components/schemas/ConsentScope' }
        expires_at: { type: ['string', 'null'], format: date-time }
        evidence: { $ref: '#/components/schemas/ConsentEvidenceInput' }
    ConsentWithdrawalRequest:
      type: object
      additionalProperties: false
      required: [scope, evidence]
      properties:
        scope: { $ref: '#/components/schemas/ConsentScope' }
        evidence: { $ref: '#/components/schemas/ConsentEvidenceInput' }
    ConsentState:
      type: object
      required: [consent_type, scope, scope_hash, effective_status, version, data_region]
      properties:
        consent_type: { enum: [core_service, raw_av_recording, org_sharing, product_analytics, model_training, marketing] }
        scope: { $ref: '#/components/schemas/ConsentScope' }
        scope_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        effective_status: { enum: [not_granted, granted, withdrawn, expired] }
        version: { type: integer, minimum: 0 }
        grant: { anyOf: [{ $ref: '#/components/schemas/ConsentGrant' }, { type: 'null' }] }
        data_region: { $ref: '#/components/schemas/Region' }
    ConsentAccessRequest:
      type: object
      additionalProperties: false
      required: [consent_type, scope]
      properties:
        consent_type: { enum: [core_service, raw_av_recording, org_sharing, product_analytics, model_training, marketing] }
        scope: { $ref: '#/components/schemas/ConsentScope' }
    ConsentAccessDecision:
      type: object
      required: [allowed, consent_type, scope_hash, effective_status, decided_at, data_region]
      properties:
        allowed: { type: boolean }
        consent_type: { enum: [core_service, raw_av_recording, org_sharing, product_analytics, model_training, marketing] }
        scope_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        effective_status: { enum: [not_granted, granted, withdrawn, expired] }
        grant_id: { type: ['string', 'null'], format: uuid }
        expires_at: { type: ['string', 'null'], format: date-time }
        decided_at: { type: string, format: date-time }
        data_region: { $ref: '#/components/schemas/Region' }
    UploadRejectionReason:
      enum: [unsupported_type, oversized, type_spoofed, corrupted, encrypted, virus_detected, macros_detected, archive_bomb_detected, sandbox_policy_violation]
      description: 安全拒绝的稳定机器码；用户界面同时展示具体 message 与 UploadImpact
    UploadImpact:
      type: object
      required: [original_input_retained, retryable, billable, scoring_affected]
      properties:
        original_input_retained: { type: boolean, description: 安全拒绝为 false；扫描超时/暂时不可用为 true }
        retryable: { type: boolean, description: 仅暂时失败可通过 retry 端点重试 }
        billable: { type: boolean, const: false }
        scoring_affected: { type: boolean, const: false }
        retry_action: { type: ['string', 'null'], description: 可执行的下一步；不可重试时为空 }
    ResumeUpload:
      type: object
      required: [upload_id, data_region, status, filename, size_bytes, storage_scope, impact, created_at, updated_at]
      properties:
        upload_id: { type: string, format: uuid }
        data_region: { $ref: '#/components/schemas/Region' }
        status: { enum: [QUARANTINED, SCANNING, ACCEPTED, REJECTED, RETRYABLE_FAILURE] }
        filename: { type: string }
        size_bytes: { type: integer, minimum: 0, maximum: 10485760 }
        detected_media_type: { type: ['string', 'null'], enum: [application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, null] }
        storage_scope: { type: string, const: uploads, description: 对外只公开逻辑存储范围；内部桶名与对象键永不返回 }
        rejection_reason: { anyOf: [{ $ref: '#/components/schemas/UploadRejectionReason' }, { type: 'null' }] }
        message: { type: ['string', 'null'], description: 具体用户可见说明，不含文件正文或检测样本内容 }
        impact: { $ref: '#/components/schemas/UploadImpact' }
        sandbox_attestation:
          type: ['object', 'null']
          properties:
            network_disabled: { type: boolean, const: true }
            ephemeral: { type: boolean, const: true }
            read_only_root_filesystem: { type: boolean, const: true }
            credentials_mounted: { type: boolean, const: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UploadRejectedError:
      allOf:
        - { $ref: '#/components/schemas/Error' }
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { const: upload_rejected }
                details:
                  type: object
                  required: [reason, impact]
                  properties:
                    reason: { $ref: '#/components/schemas/UploadRejectionReason' }
                    impact: { $ref: '#/components/schemas/UploadImpact' }
    SensitiveFieldCategory:
      enum: [phone, email, id_number, address, photo, protected_attribute, other_pii]
      description: 只记录类别、不记录敏感值；protected_attribute 覆盖外貌、性别、年龄、种族、国籍、残障、婚育、宗教、情绪、微表情与人格推断
    ResumeParseCommand:
      type: object
      additionalProperties: false
      required: [resume_id, accepted_upload_id, language]
      properties:
        resume_id: { type: string, format: uuid }
        accepted_upload_id: { type: string, format: uuid, description: 必须为当前用户所属区域且安全扫描通过的 uploads/accepted 对象 }
        language: { $ref: '#/components/schemas/Language' }
    ParseImpact:
      type: object
      additionalProperties: false
      required: [original_input_retained, retryable, billable, scoring_affected]
      properties:
        original_input_retained: { type: boolean }
        retryable: { type: boolean }
        billable: { type: boolean, const: false }
        scoring_affected: { type: boolean, const: false }
        retry_action: { type: ['string', 'null'] }
    ResumeParseTask:
      type: object
      additionalProperties: false
      required: [task_id, resume_id, accepted_upload_id, data_region, language, status, impact]
      properties:
        task_id: { type: string, format: uuid }
        resume_id: { type: string, format: uuid }
        accepted_upload_id: { type: string, format: uuid }
        data_region: { $ref: '#/components/schemas/Region' }
        language: { $ref: '#/components/schemas/Language' }
        status: { enum: [PENDING, PARSING, AWAITING_CONFIRMATION, CONFIRMED, RETRYABLE_FAILURE, FAILED] }
        current_version: { type: ['integer', 'null'], minimum: 1 }
        message: { type: ['string', 'null'], description: 不包含简历正文或敏感值 }
        impact: { $ref: '#/components/schemas/ParseImpact' }
    ParsedResumeVersion:
      type: object
      additionalProperties: false
      required: [resume_id, resume_version, data_region, profile, low_confidence_paths, reviewed_low_confidence_paths, excluded_sensitive_fields, confirmed_by_user]
      properties:
        resume_id: { type: string, format: uuid }
        resume_version: { type: integer, minimum: 1 }
        data_region: { $ref: '#/components/schemas/Region' }
        profile: { type: object, description: 必须通过 ai/schemas/resume-profile.schema.json；敏感键和值递归命中数为 0, additionalProperties: true }
        low_confidence_paths: { type: array, items: { type: string }, uniqueItems: true }
        reviewed_low_confidence_paths: { type: array, items: { type: string }, uniqueItems: true }
        excluded_sensitive_fields: { type: array, items: { $ref: '#/components/schemas/SensitiveFieldCategory' }, uniqueItems: true, description: 仅类别，无原值 }
        confirmed_by_user: { type: boolean }
    ResumeFieldEdit:
      type: object
      additionalProperties: false
      required: [base_version, path, operation]
      properties:
        base_version: { type: integer, minimum: 1, description: 必须等于 URL version 与当前最新版本 }
        path: { type: string, pattern: '^/', description: 面试安全画像内的非根 JSON Pointer }
        operation: { enum: [add, replace, remove, confirm] }
        value: { description: add/replace 必填；remove/confirm 忽略。不得包含敏感键或值 }
    Resume:
      type: object
      required: [resume_id, data_region, status]
      properties:
        resume_id: { type: string, format: uuid }
        data_region: { $ref: '#/components/schemas/Region' }
        language: { $ref: '#/components/schemas/Language' }
        status: { enum: [uploaded, parsing, awaiting_confirmation, confirmed, parse_failed] }
        current_version: { type: ['integer', 'null'], minimum: 1 }
        rejected_reason: { enum: [corrupted, encrypted, oversized, type_spoofed, unsafe, null], default: null }
    ResumeVersion:
      type: object
      required: [resume_id, resume_version, confirmed_by_user]
      properties:
        resume_id: { type: string, format: uuid }
        resume_version: { type: integer, minimum: 1 }
        confirmed_by_user: { type: boolean }
        profile: { type: ['object', 'null'], description: 结构对齐 ai/schemas/resume-profile.schema.json（面试上下文安全版，不含敏感字段）, additionalProperties: true }
        low_confidence_paths: { type: array, items: { type: string } }
