        elapsed_seconds: { type: integer, minimum: 0, description: 正式计时（暂停与重连不计） }
        billable_seconds: { type: integer, minimum: 0, description: 计费秒数（仅数字人已连接且 LIVE） }
        paused_seconds: { type: integer, minimum: 0, description: 累计暂停秒数（不计费不判失败） }
