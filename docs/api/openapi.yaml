        resume_version: { type: ['integer', 'null'], minimum: 1 }
        job_id: { type: ['string', 'null'], format: uuid }
        job_version: { type: ['integer', 'null'], minimum: 1 }
        consent_required: { type: boolean }
        modal_title: { type: string, minLength: 1 }
        modal_message: { type: string, minLength: 1 }
        effects: { type: array, items: { type: string }, uniqueItems: true }
        allowed_scoring_dimensions:
          type: array
          items: { enum: [expression, logic, communication, adaptability] }
