        project_id: { type: string, format: uuid }
        round_sequence: { type: integer, minimum: 1, maximum: 5 }
        status: { enum: [RETRY_SCHEDULED, RETRY_IN_PROGRESS, SCORING, COMPLETED] }
        locked_dimensions: { type: array, items: { $ref: '#/components/schemas/DimensionKey' } }
        rescope_dimensions: { type: array, items: { $ref: '#/components/schemas/DimensionKey' }, description: 失败维度与未覆盖点对应维度 }
        data_region: { $ref: '#/components/schemas/Region' }
    Entitlement:
      type: object
      required: [entitlement_id, kind, balance_seconds, data_region]
      properties:
        entitlement_id: { type: string, format: uuid }
        kind: { enum: [free_credit, project_pack, pro_subscription, topup_pack, org_pool] }
        balance_seconds: { type: integer, minimum: 0 }
        included_retry_count: { type: ['integer', 'null'], minimum: 0 }
        expires_at: { type: ['string', 'null'], format: date-time }
        project_id: { type: ['string', 'null'], format: uuid }
        data_region: { $ref: '#/components/schemas/Region' }
    Quote:
      type: object
      required: [quote_id, project_id, plan_version, total, status, expires_at]
      properties:
        quote_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        plan_version: { type: integer, minimum: 1 }
        status: { enum: [QUOTE_DRAFT, QUOTE_PRESENTED, QUOTE_RECALCULATED, QUOTE_ACCEPTED] }
        total: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        included_rounds: { type: integer, minimum: 1, maximum: 5 }
        max_estimated_seconds: { type: integer, minimum: 0 }
        included_retry_per_failed_round: { type: integer, const: 1 }
        expires_at: { type: string, format: date-time }
        data_region: { $ref: '#/components/schemas/Region' }
    Order:
      type: object
      required: [order_id, quote_id, status, total, created_at]
      properties:
        order_id: { type: string, format: uuid }
        quote_id: { type: string, format: uuid }
        status: { enum: [ORDER_CREATED, PAYMENT_PENDING, PAID, PAYMENT_FAILED, PAYMENT_TIMEOUT, ORDER_CANCELLED] }
        total: { $ref: '#/components/schemas/Money' }
        refunded_total: { type: ['integer', 'null'], minimum: 0, description: 已原路退回金额（重复扣款自动退回后可见） }
        progress_note: { type: ['string', 'null'], description: 支付成功未到账时保持处理中的真实进度说明 }
        created_at: { type: string, format: date-time }
        data_region: { $ref: '#/components/schemas/Region' }
    Refund:
      type: object
      required: [refund_id, order_id, status, amount, reason, created_at]
      properties:
        refund_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        status: { enum: [REFUND_REQUESTED, REFUND_REVIEWING, REFUND_APPROVED, REFUNDED, REFUND_REJECTED] }
        kind: { enum: [user_request, system_fault, compensation, duplicate_charge] }
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string }
        reject_reason: { type: ['string', 'null'] }
        approver_pair: { type: ['array', 'null'], items: { type: string }, description: 双人审批对（同一审批人去重） }
        created_at: { type: string, format: date-time }
        data_region: { $ref: '#/components/schemas/Region' }
    TaxLine:
      type: object
      required: [name, rate_percent, amount]
      properties:
        name: { type: string }
        rate_percent: { type: number, description: 税率百分比（如 6、19） }
        amount: { $ref: '#/components/schemas/Money' }
    Invoice:
      type: object
      required: [invoice_id, order_id, kind, number, status, total, created_at]
      properties:
        invoice_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        kind: { enum: [invoice, receipt], description: cn 合规发票 / eu、intl 税费明示收据 }
        number: { type: string, description: 发票号码或收据编号 }
        status: { enum: [issued, cancelled] }
        subtotal: { $ref: '#/components/schemas/Money' }
        tax_lines: { type: array, items: { $ref: '#/components/schemas/TaxLine' } }
        total: { $ref: '#/components/schemas/Money' }
        created_at: { type: string, format: date-time }
        data_region: { $ref: '#/components/schemas/Region' }
    RegionalPricing:
      type: object
      required: [region, currency, per_minute_cents, tax_rate, tax_label, invoice_kind]
      properties:
        region: { $ref: '#/components/schemas/Region' }
        currency: { type: string }
        per_minute_cents: { type: integer, minimum: 0 }
        tax_rate: { type: number, description: 税率（如 0.06、0.19、0） }
        tax_label: { type: string }
        invoice_kind: { enum: [invoice, receipt] }
    UsageLedgerEntry:
      type: object
      required: [entry_id, entry_type, occurred_at, balance_after_seconds]
      properties:
        entry_id: { type: string, format: uuid }
        entry_type: { enum: [reservation, consumption, release, refund, reversal] }
        project_id: { type: ['string', 'null'], format: uuid }
        round_sequence: { type: ['integer', 'null'], minimum: 1, maximum: 5 }
        usage_seconds: { type: ['integer', 'null'], minimum: 0 }
        reason: { type: ['string', 'null'] }
        balance_after_seconds: { type: integer, description: 余额快照（追加式账本） }
        occurred_at: { type: string, format: date-time }
    Subscription:
      type: object
      required: [subscription_id, status, current_period_end, balance_seconds]
      properties:
        subscription_id: { type: string, format: uuid }
        status: { enum: [SUB_ACTIVE, SUB_CANCELLED, SUB_EXPIRED] }
        monthly_quota_seconds: { type: integer, minimum: 0 }
        balance_seconds: { type: integer, minimum: 0, description: 总余额 ≤ 月度额度 2 倍 }
        carryover_cap_note: { type: string, description: 未使用时长最多结转一个账期 }
        current_period_end: { type: string, format: date-time }
        auto_renew: { type: boolean }
        consent_monthly_seconds: { type: ['integer', 'null'], minimum: 1, description: 同意时月额度（条款变化须重新同意） }
        consent_price_cents: { type: ['integer', 'null'], minimum: 0, description: 同意时月度价格（分） }
        data_region: { $ref: '#/components/schemas/Region' }
    RenewalRecord:
      type: object
      required: [renewal_id, subscription_id, status, period_start, period_end, monthly_seconds, price_cents]
      properties:
        renewal_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        status: { enum: [reminded, charged, failed] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        monthly_seconds: { type: integer, minimum: 1 }
        price_cents: { type: integer, minimum: 0 }
        reminded_at: { type: ['string', 'null'], format: date-time, description: 扣款前提醒时间 }
        charged_at: { type: ['string', 'null'], format: date-time }
        data_region: { $ref: '#/components/schemas/Region' }
    Organization:
      type: object
      required: [org_id, name, data_region, status]
      properties:
        org_id: { type: string, format: uuid }
        name: { type: string }
        data_region: { $ref: '#/components/schemas/Region' }
        status: { enum: [active, suspended, deactivated] }
        caller_role: { enum: [owner, admin, instructor, privacy_auditor, finance, candidate, null], default: null }
    OrgMember:
      type: object
      required: [org_id, user_id, role, joined_at]
      properties:
        org_id: { type: string, format: uuid }
        user_id: { type: string, description: 个人账户 ID（无影子账户） }
        role: { enum: [owner, admin, instructor, privacy_auditor, finance, candidate] }
        invite_method: { enum: [link, org_email, bulk_list, sso, scim] }
        joined_at: { type: string, format: date-time }
        left_at: { type: ['string', 'null'], format: date-time }
    Invitation:
      type: object
      required: [invitation_id, org_id, role, invite_method, status, expires_at]
      properties:
        invitation_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        email: { type: ['string', 'null'], format: email }
        role: { enum: [owner, admin, instructor, privacy_auditor, finance, candidate] }
        invite_method: { enum: [link, org_email, bulk_list, sso, scim] }
        status: { enum: [pending, accepted, revoked] }
        expires_at: { type: string, format: date-time }
    Assignment:
      type: object
      required: [assignment_id, org_id, title, status]
      properties:
        assignment_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        title: { type: string }
        status: { enum: [draft, published, closed] }
        completion_summary:
          type: object
          description: 默认最小可见（未授权不展示分数/简历/报告/录像）
          properties:
            not_started: { type: integer, minimum: 0 }
            in_progress: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            quit: { type: integer, minimum: 0 }
            system_fault_count: { type: integer, minimum: 0 }
            org_credit_used_seconds: { type: integer, minimum: 0 }
            result_shared: { type: integer, minimum: 0 }
            result_not_shared: { type: integer, minimum: 0, description: 只显示“已完成但未共享结果”，不显示失败 }
        data_region: { $ref: '#/components/schemas/Region' }
    AggregateResult:
      type: object
      required: [data_region, groups]
      properties:
        data_region: { $ref: '#/components/schemas/Region' }
        groups:
          type: array
          items:
            type: object
            required: [group_key, member_count]
            properties:
              group_key: { type: string }
              member_count: { type: integer, minimum: 0 }
              hidden: { type: boolean, description: member_count < 10 时 true 且不返回指标 }
              completion_rate: { type: ['number', 'null'], minimum: 0, maximum: 1 }
              dimension_avg: { type: ['object', 'null'], additionalProperties: { type: ['number', 'null'] } }
              improvement_trend: { type: ['number', 'null'] }
        personal_ranking_available: { const: false, description: 平台不提供个人排名/搜索/雇主推荐 }
    DeletionTask:
      type: object
      required: [task_id, target_type, target_id, status, progress]
      properties:
        task_id: { type: string, format: uuid }
        target_type: { enum: [project, resume, job, account] }
        target_id: { type: string, format: uuid }
        status: { enum: [REQUESTED, VERIFYING, IN_PROGRESS, COMPLETED, FAILED] }
        progress:
          type: object
          description: 真实进度（逐项状态；FAILED 可重试）
          properties:
            database: { enum: [pending, in_progress, done, failed] }
            cache: { enum: [pending, in_progress, done, failed] }
            search_index: { enum: [pending, in_progress, done, failed] }
            object_storage: { enum: [pending, in_progress, done, failed] }
            backups: { enum: [pending, in_progress, done, failed], description: 备份按保留策略到期清除，状态如实展示 }
            third_party_processors: { enum: [pending, in_progress, done, failed] }
        legal_retention_note: { type: ['string', 'null'], description: 法定财务记录保留但解除内容关联 }
        data_region: { $ref: '#/components/schemas/Region' }
    AsyncTask:
      type: object
      required: [task_id, task_type, status]
      properties:
        task_id: { type: string, format: uuid }
        task_type: { enum: [parse, plan_generate, scoring, review, report_generate, export, refund, rubric_deprecate] }
        status: { enum: [queued, running, succeeded, failed] }
        progress_note: { type: ['string', 'null'], description: 真实进度说明（失败含可重试动作） }
        data_region: { $ref: '#/components/schemas/Region' }
    ReviewAccepted:
      type: object
      description: 正式复核接受响应（同步重算完成；SCORING-SPEC 6.10）
      required: [task_id, task_type, status, review_result]
      properties:
        task_id: { type: string, format: uuid }
        task_type: { const: review }
        status: { const: succeeded }
        progress_note: { type: ['string', 'null'] }
        data_region: { $ref: '#/components/schemas/Region' }
        review_result: { $ref: '#/components/schemas/ReviewResult' }
    ReviewResult:
      type: object
      description: 复核前后对比（原结果、新结果与原因；全部版本保留）
      required: [original, review, changes, reason]
      properties:
        original: { $ref: '#/components/schemas/ScoreResult' }
        review: { $ref: '#/components/schemas/ScoreResult' }
        changes:
          type: array
          items:
            type: object
            required: [dimension, status_before, status_after]
            properties:
              dimension: { $ref: '#/components/schemas/DimensionKey' }
              before: { type: ['integer', 'null'], minimum: 0, maximum: 100 }
              after: { type: ['integer', 'null'], minimum: 0, maximum: 100 }
              status_before: { enum: [scored, insufficient_evidence, uncovered, not_applicable, locked_carried] }
              status_after: { enum: [scored, insufficient_evidence, uncovered, not_applicable, locked_carried] }
        reason: { type: string }
    ProviderInfo:
      type: object
      required: [provider_id, capability, status]
      properties:
        provider_id: { type: string }
        capability: { enum: [llm, asr, tts, avatar, search] }
        status: { enum: [active, ramping, disabled] }
        ramp_percent: { type: ['integer', 'null'], minimum: 0, maximum: 100 }
        pinned_model_version: { type: ['string', 'null'], description: 活跃正式面试固定开始时版本 }
        health: { type: ['object', 'null'], description: 匿名技术指标（延迟/错误率/熔断状态）, additionalProperties: true }
        note: { type: string, const: 密钥由独立密钥系统管理，本接口永不返回完整值 }
    AuditLog:
      type: object
      required: [audit_id, actor_role, action, occurred_at]
      properties:
        audit_id: { type: string, format: uuid }
        actor_id: { type: ['string', 'null'], description: 默认脱敏 }
        actor_role: { type: string }
        action: { type: string }
        target_ref: { type: ['string', 'null'] }
        authorization_basis: { type: ['string', 'null'], description: 授权依据（ConsentGrant/破窗流程） }
        occurred_at: { type: string, format: date-time }

security:
  - bearerAuth: []
